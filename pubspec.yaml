name: ezan_vakitlerim
description: "Ücretsiz, reklamsız namaz vakitleri uygulaması (Android)."
publish_to: 'none'

# Sürüm: 1.0.0 kullanıcıya görünen sürüm. "+" sonrasını GitHub her derlemede kendisi artırır.
version: 1.2.8+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  # Vakit girince bildirim göstermek için
  flutter_local_notifications: ^22.3.3
  # Bildirimleri Türkiye saatine göre kurmak için
  timezone: ^0.11.2
  # GPS ile konum bulmak için
  geolocator: ^14.1.2
  # Seçilen konumu ve ayarları telefonda saklamak için
  shared_preferences: ^2.5.6
  # İndirilen güncellemenin bozuk olup olmadığını parmak iziyle (SHA-256) kontrol etmek için
  crypto: ^3.0.8
  # Yakındaki camileri haritada göstermek için (OpenStreetMap, ücretsiz, anahtarsız)
  flutter_map: ^8.3.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/yenilikler.txt
    - assets/logo_on.png
    - assets/icerik/
    - assets/veri/ilceler.json
