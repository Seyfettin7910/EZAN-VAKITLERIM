# Yardımcı iş: Releases'teki APK'yı indirir, imzasını kontrol eder, Android emülatöründe açıp
# ekran görüntüsü ve hata günlüğü alır. Sonuç "gunluk-kontrol" dalına yazılır.
name: APK kontrol
on:
  workflow_dispatch:
    inputs:
      etiket:
        description: 'Denenecek sürüm etiketi (boş = son sürüm)'
        required: false
        default: ''
      gezinti:
        description: 'Ezan denemesi yerine sekmeleri gezip ekran görüntüsü al'
        required: false
        default: 'hayir'
      vakit:
        description: 'Denenecek vakit (0 imsak ... 5 yatsı, 6 teheccüd)'
        required: false
        default: '3'
      bekle:
        description: 'Ezan başladıktan sonra ikinci ekran görüntüsü için bekleme (saniye)'
        required: false
        default: '30'
permissions:
  contents: write
jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: APK'yı indir ve incele
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/k && cd /tmp/k
          gh release download ${{ inputs.etiket }} --repo "${{ github.repository }}" --pattern Ezan-Vakitlerim.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          {
            echo "== etiket: ${{ inputs.etiket }}"
            echo "== boyut"; ls -l Ezan-Vakitlerim.apk; sha256sum Ezan-Vakitlerim.apk
            echo "== apksigner"; $BT/apksigner verify --print-certs Ezan-Vakitlerim.apk 2>&1 | grep -v WARNING
            echo "== paket"; $BT/aapt2 dump badging Ezan-Vakitlerim.apk 2>&1 | head -2
          } > /tmp/k/kontrol.txt 2>&1 || true

      - name: KVM aç
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emülatörde aç
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            if [ "${{ inputs.gezinti }}" = "evet" ]; then bash tool/emulator_gezinti.sh; exit 0; fi
            adb install -r /tmp/k/Ezan-Vakitlerim.apk > /tmp/k/kurulum.txt 2>&1 || true
            adb shell pm grant com.seyfettin.ezan_vakitlerim android.permission.POST_NOTIFICATIONS || true
            adb logcat -c
            adb shell am start -n com.seyfettin.ezan_vakitlerim/.MainActivity
            sleep 25
            adb exec-out screencap -p > /tmp/k/ekran.png
            adb shell input keyevent KEYCODE_HOME
            sleep 2
            adb shell input keyevent KEYCODE_SLEEP
            sleep 3
            adb shell am broadcast -n com.seyfettin.ezan_vakitlerim/.DenemeAlici --ei vakit ${{ inputs.vakit }} --ei saniye 5 > /tmp/k/deneme.txt 2>&1 || true
            sleep 15
            adb exec-out screencap -p > /tmp/k/ekran-ezan.png
            adb shell dumpsys audio > /tmp/k/ses-tam.txt 2>&1 || true
            adb shell dumpsys activity services com.seyfettin.ezan_vakitlerim > /tmp/k/servis.txt 2>&1 || true
            adb shell dumpsys notification --noredact > /tmp/k/bildirim-tam.txt 2>&1 || true
            sleep ${{ inputs.bekle }}
            adb exec-out screencap -p > /tmp/k/ekran-ezan2.png
            adb shell dumpsys notification --noredact > /tmp/k/bildirim2-tam.txt 2>&1 || true
            adb logcat -d > /tmp/k/logcat-tam.txt || true

      - name: Sonucu kaydet
        if: always()
        run: |
          cd /tmp/k
          grep -E "flutter|AndroidRuntime|FATAL|Exception|ezan_vakitlerim" logcat-tam.txt | tail -200 > logcat.txt 2>/dev/null || true
          grep -i -E "player|piid|usage=USAGE_ALARM|state:" ses-tam.txt | head -40 > ses.txt 2>/dev/null || true
          grep -A12 "ezan_vakitlerim" bildirim-tam.txt | head -80 > bildirim.txt 2>/dev/null || true
          grep -E "android.text=|android.title=" bildirim2-tam.txt | head -20 > bildirim2.txt 2>/dev/null || true
          rm -f Ezan-Vakitlerim.apk logcat-tam.txt ses-tam.txt bildirim-tam.txt bildirim2-tam.txt
          cd $GITHUB_WORKSPACE
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q --orphan gunluk-kontrol
          git rm -rf -q --cached . > /dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/k/. .
          git add -A
          git commit -q -m "APK kontrol ${{ inputs.etiket }}"
          git push -q -f origin gunluk-kontrol
