# Tek seferlik yardımcı iş: Flutter'ın güncel Android şablonunu üretip indirilebilir dosya olarak bırakır.
name: Android iskeleti uret
on:
  workflow_dispatch:
jobs:
  iskelet:
    runs-on: ubuntu-latest
    steps:
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - run: flutter create --platforms=android --org com.seyfettin --project-name ezan_vakitlerim iskelet
      - run: flutter --version > iskelet/flutter-surum.txt
      - uses: actions/upload-artifact@v4
        with:
          name: iskelet
          path: |
            iskelet/android
            iskelet/pubspec.yaml
            iskelet/analysis_options.yaml
            iskelet/.gitignore
            iskelet/flutter-surum.txt
          include-hidden-files: true
