# Her güncellemede APK'yı derleyip Releases sayfasına koyan iş.
# Sabit indirme linki (hep son sürüm):
# https://github.com/Seyfettin7910/EZAN-VAKITLERIM/releases/latest/download/Ezan-Vakitlerim.apk
name: APK derle

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/apk-kontrol.yml'
      - 'tasarim/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Paketleri indir
        run: |
          mkdir -p gunluk
          set -o pipefail
          flutter pub get 2>&1 | tee gunluk/1-paketler.txt
          cp pubspec.lock gunluk/pubspec.lock

      - name: Kod kontrolü
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee gunluk/2-analiz.txt

      # İmza anahtarı GitHub Secrets'ta varsa onunla imzalanır (güncellemeler üstüne kurulur).
      - name: İmza anahtarını hazırla
        env:
          ANAHTAR_JKS_BASE64: ${{ secrets.ANAHTAR_JKS_BASE64 }}
          ANAHTAR_SIFRE: ${{ secrets.ANAHTAR_SIFRE }}
        run: |
          if [ -n "$ANAHTAR_JKS_BASE64" ] && [ -n "$ANAHTAR_SIFRE" ]; then
            echo "$ANAHTAR_JKS_BASE64" | base64 -d > android/app/vakit.jks
            printf 'storeFile=vakit.jks\nstorePassword=%s\nkeyAlias=vakit\nkeyPassword=%s\n' "$ANAHTAR_SIFRE" "$ANAHTAR_SIFRE" > android/key.properties
            echo "IMZA=kalici" >> "$GITHUB_ENV"
          else
            echo "::warning::İmza anahtarı yok, geçici anahtarla imzalanıyor."
            echo "IMZA=gecici" >> "$GITHUB_ENV"
          fi

      - name: APK derle
        run: |
          set -o pipefail
          flutter build apk --release --build-number=${{ github.run_number }} --dart-define=DERLEME_NO=${{ github.run_number }} 2>&1 | tee gunluk/3-derleme.txt

      - name: Sürümü oku, dosyayı adlandır, sürüm bilgisini yaz
        run: |
          SURUM=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "SURUM=$SURUM" >> "$GITHUB_ENV"
          cp build/app/outputs/flutter-apk/app-release.apk Ezan-Vakitlerim.apk
          # Uygulamanın güncelleme denetimi bu dosyayı okur
          jq -n --arg surum "$SURUM" --argjson derleme ${{ github.run_number }} \
            --argjson boyut $(stat -c %s Ezan-Vakitlerim.apk) \
            --arg sha256 "$(sha256sum Ezan-Vakitlerim.apk | cut -d' ' -f1)" \
            --rawfile notlar assets/yenilikler.txt \
            '{surum:$surum, derleme:$derleme, boyut:$boyut, sha256:$sha256, notlar:$notlar}' > surum.json
          cat surum.json
          cp surum.json gunluk/
          { cat assets/yenilikler.txt; echo; echo "Derleme no: ${{ github.run_number }} · İmza: $IMZA"; echo "İndir: https://github.com/Seyfettin7910/EZAN-VAKITLERIM/releases/latest/download/Ezan-Vakitlerim.apk"; } > notlar.md

      - name: Releases sayfasına koy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.SURUM }}
          name: Ezan Vakitlerim ${{ env.SURUM }}
          make_latest: true
          files: |
            Ezan-Vakitlerim.apk
            surum.json
          body_path: notlar.md

      # Derleme günlüğünü "gunluk" dalına yazar (hata olursa sebebini okumak için)
      - name: Günlüğü kaydet
        if: always()
        run: |
          mkdir -p /tmp/g && cp -r gunluk/. /tmp/g/ 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q --orphan gunluk
          git rm -rf -q --cached . > /dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/g/. .
          echo "Derleme ${{ github.run_number }} · ${{ job.status }}" > OZET.txt
          git add -A
          git commit -q -m "Derleme günlüğü ${{ github.run_number }}"
          git push -q -f origin gunluk
